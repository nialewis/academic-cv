bio: |
  I am a Postdoctoral Researcher at Rice University, studying photon-nucleus collisions recorded by the **CMS** experiment at the LHC.  Previously, I worked on both the **STAR** and **PHENIX** experiments at RHIC.

  My research focuses on the strong nuclear force, one of the four fundamental forces of nature that binds protons and neutrons together to form nuclei.  I am studying the nature of Quantum Chromodynamics, baryon structure, collectivity in small systems and detector instrumentation.  
