experience:
  - role: Postdoctoral Researcher & Rice Academy Postdoctoral Fellow
    org: Rice University
    url: https://www.rice.edu/
    start: 2023-07-01
    summary: |
      **Collaboration:** CMS
      * Observed a long-range near-side peak in high-multiplicity photonuclear collisions. This two-particle correlations analysis was performed on PbPb data and was the first clear indication of high-energy density QCD dynamics happening in photonuclear collisions.
      * Measurement of identical-particle femtoscopic correlations in high-multiplicity photonuclear collisions in order to probe the spatial dimensions of these photonuclear collisions.
      * Measurement of the J/ψ and ψ(2s) cross sections in coherent ultraperipheral PbPb collisions, which are sensitive to the internal structure of these nuclei.
      * Managed project on the Endcap Timing Layer (ETL) detector for the CMS upgrade, designed the high-voltage map, maintained a test stand for developing front-end electronics, and took data to test those electronics at a test beam facility.
      * Led initiative to push the Level-1 tracking trigger for the CMS upgrade to lower momentum tracks. This trigger would become one of the main triggers for recording heavy-ion collision data at CMS.
  - role: Research Associate
    org: Brookhaven National Laboratory
    url: https://www.bnl.gov/
    start: 2020-09-01
    end: 2023-06-30
    summary: |
      **Collaboration:** STAR
      * Implemented initial analysis of baryon stopping in inclusive photonuclear collisions in AuAu data. This measurement was found to be sensitive to the baryon number carrier and inconsistent with the conventional model of the valence quarks carrying baryon number and has been published as Science 393, 727 (2026).
      * Contributed to the commissioning and calibration of the Small-Strip Thin Gap Chamber (sTGC) for the STAR forward upgrade.
  - role: Graduate Student Research Assistant
    org: University of Michigan, Ann Arbor
    url: https://umich.edu/
    start: 2016-05-01
    end: 2020-08-31
    summary: |
      **Collaboration:** PHENIX, sPHENIX
      * Wrote a thesis on analyses of spin-momentum correlations in transversely polarized proton-proton collisions recorded by PHENIX using direct photons, neutral pions, and eta mesons.
      * Developed and maintained a quality assurance tester for silicon photomultipliers (SiPMs) for the sPHENIX calorimeters. Managed the Michigan team by coordinating a testing schedule for team members.

